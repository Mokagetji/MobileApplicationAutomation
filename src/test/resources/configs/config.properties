#These are the execution types, we can either automate the app on web or the actual app
#executionType=mobileWeb
webUrl=https://ndosisimplifiedautomation.vercel.app/
executionType=nativeApp

#android capabilities (same capabilities from appium inspector)
#browserName=chrome
#automationName=UiAutomator2
#platformName=Android
#appPath=Apps/app-qa-release.apk

#ios capabilities (this for ios automation)
browserName=edge
automationName=XCUITest
platformNames=iOS
appPath=Apps/app-qa-release.app

#AppiumServer
appiumServer=http://127.0.0.1:4723
